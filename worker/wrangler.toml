name = "signal-pitcher"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.signaladvise.com", custom_domain = true }
]

# Cron: every minute, 9am-5pm Central, weekdays. Worker checks the window
# and the daily cap before doing anything, so cron firing outside is a no-op.
[triggers]
crons = ["* 14-22 * * 1-5"]  # UTC; 14-22 UTC = 9a-5p Central (CST/CDT shifts; we re-check inside the worker)

[[d1_databases]]
binding = "DB"
database_name = "signaladvise"
database_id = "3524064f-ff87-4de8-a62e-1961124aaf7b"

[[queues.producers]]
binding = "PITCHER_QUEUE"
queue = "signal-pitcher"

[[queues.consumers]]
queue = "signal-pitcher"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "signal-pitcher-dlq"

[vars]
SENDER_EMAIL = "info@signaladvise.com"
REPLY_TO = "info@signaladvise.com"
SENDER_NAME = "Signal Advisory"
PHYSICAL_ADDRESS = "Signal Advisory LLC, Kansas City, MO"
UNSUBSCRIBE_BASE_URL = "https://api.signaladvise.com/u"
DAILY_CAP = "20"          # ramp: wk1=20, wk2=50, wk3=100, wk4+=200
SEND_WINDOW_TZ = "America/Chicago"
SEND_WINDOW_START_HOUR = "9"
SEND_WINDOW_END_HOUR = "17"
JITTER_MAX_SECONDS = "30"
CALENDLY_URL = "https://calendly.com/signaladvise-info/30min"
GMAIL_USER = "brandon@signaladvise.com"
DRAFT_MODE = "1"          # 1 = create drafts (human review), 0 = auto-send

# Secrets (set via `wrangler secret put <NAME>`):
#   RESEND_API_KEY
#   ANTHROPIC_API_KEY
#   GMAIL_CLIENT_ID
#   GMAIL_CLIENT_SECRET
#   GMAIL_REFRESH_TOKEN
