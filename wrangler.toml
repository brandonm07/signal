name = "signals"
compatibility_date = "2025-01-01"

# pnpm matches web/pnpm-lock.yaml — bun ignored the lockfile, so deploys
# could resolve different dependency versions than local dev.
[build]
command = "cd web && pnpm install --frozen-lockfile && pnpm run build"

[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
